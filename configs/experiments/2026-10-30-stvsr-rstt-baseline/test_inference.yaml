# Full test-set inference (2023-01-01 .. 2024-01-04, global) for the fine-tuned RSTT-S baseline
# (finetune.yaml), on the same split, domain and tiling as the diffusion runs' test inference, e.g.
# ../2026-09-15-video-pmd-spatiotemporal-25km-100km-two-block-hiro-patch-test-inference-global/.
# model: is pasted from finetune.yaml.
#
# n_ensemble 4 as in the diffusion runs' test inference, so the stores line up for scoring. RSTT is
# deterministic, so the 4 members are identical (CRPS reduces to MAE, spread is 0); one chunk of 4
# runs a single forward pass per patch instead of four.
#
#   CUDA_VISIBLE_DEVICES=5 conda run --no-capture-output -n fme \
#       python -m fme.downscaling.video_inference \
#       configs/experiments/2026-10-30-stvsr-rstt-baseline/test_inference.yaml
#
# Resumable: rerun after an interruption and finished batches are skipped.
checkpoint_path: /data/pmd/runs/stvsr-rstt-finetune/checkpoints/best.ckpt
experiment_dir: /data/pmd/runs/eval-stvsr-rstt/finetune-test-logs
output_path: /data/pmd/runs/eval-stvsr-rstt/finetune-test-2023-2024-global-ens4.zarr
n_ensemble: 4
ensemble_chunk_size: 4
use_ema: true
resume: true
divide_generation: true
coarse_patch_extent: [44, 72]  # the training patch (coarse_patch_extent_lat/lon in finetune.yaml)
coarse_horizontal_overlap: 1
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: local-stvsr-rstt-finetune-test-inference
  entity: ai2cm
data:
  n_timesteps: 9
  fine:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  coarse:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2023-01-01"
        stop_time: "2024-01-04"
  batch_size: 8
  num_data_workers: 1
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  rstt:
    embed_dim: 96
    depths: [4, 4, 4, 4, 4, 4, 4, 4]
    num_heads: [2, 4, 8, 16, 16, 8, 4, 2]
    window_size: [4, 4]
    mlp_ratio: 2.0
    drop_path_rate: 0.1
    back_rbs: 0
  n_timesteps: 9
  upscale: 4
  log_transform_channels:
    PRATEsfc: 86400.0
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
