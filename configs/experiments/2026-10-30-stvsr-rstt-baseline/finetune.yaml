# Deterministic space-time SR baseline, stage 2: fine-tune RSTT-S on real clips, starting from the
# pseudo-temporal pretraining run (pretrain.yaml; Choi et al., CVPR 2026). Two 100 km endpoint frames
# in, all nine 25 km frames out, plain MSE in normalized units. The no-pretraining control with the
# identical schedule is scratch.yaml.
#
# init_weights_from loads the pretrained run's EMA weights; optimizer, LR schedule and EMA start
# fresh. Ignored when this run resumes its own checkpoint.
# Launch: STAGE=finetune bash run.sh (after the pretraining run has finished).
experiment_dir: /data/pmd/runs/stvsr-rstt-finetune
init_weights_from: /data/pmd/runs/stvsr-rstt-pretrain/checkpoints/latest.ckpt
max_epochs: 20
validate_using_ema: true
validate_interval: 1
test_interval: 10
max_val_batches: 40
max_test_batches: 40
generate_n_samples: 1
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace-temporal-interp
  name: local-stvsr-rstt-finetune
  entity: ai2cm
# RSTT reference: Adam(lr 2e-4, betas 0.9/0.99), cosine annealing to 1e-7.
optimization:
  optimizer_type: Adam
  lr: 0.0002
  kwargs:
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingLR
    kwargs:
      eta_min: 1.0e-7
ema:
  decay: 0.999
coarse_patch_extent_lat: 44
coarse_patch_extent_lon: 72
train_data:
  n_timesteps: 9
  fine:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  coarse:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  batch_size: 48  # global across ranks: 2 GPUs x 24 (~51 GB/GPU est.; 32/GPU would need ~68 GB)
  num_data_workers: 4
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
validation_data:
  n_timesteps: 9
  fine:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  coarse:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  batch_size: 48
  num_data_workers: 4
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
test_data:
  n_timesteps: 9
  fine:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  coarse:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  batch_size: 48
  num_data_workers: 4
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  rstt:  # RSTT-S, the reference's configs/RSTT-S.yml (these are also the defaults)
    embed_dim: 96
    depths: [4, 4, 4, 4, 4, 4, 4, 4]
    num_heads: [2, 4, 8, 16, 16, 8, 4, 2]
    window_size: [4, 4]
    mlp_ratio: 2.0
    drop_path_rate: 0.1
    back_rbs: 0
  n_timesteps: 9
  upscale: 4
  log_transform_channels:
    PRATEsfc: 86400.0  # precip modeled in log1p(mm/day) space, as in the diffusion runs
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  # Fine (25 km) statistics, as in the diffusion runs; applied to the 100 km inputs too, so inputs,
  # baseline and output share physical units (the bicubic-upsampled 100 km endpoints are the
  # baseline, as in the diffusion runs, whatever the normalization).
  normalization:
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074   # log1p(PRATEsfc * 86400) space, matching log_transform_channels
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
