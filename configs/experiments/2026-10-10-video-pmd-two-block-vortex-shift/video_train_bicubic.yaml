# Two-block (r, d) video PMD with a translation-aware baseline, trained
# LOCALLY on 2 GPUs (no Beaker). 100km endpoints in, full 25km trajectory out.
#
# Motivation (measured on real paired data around tropical cyclones, tracks
# 789/795/829): of the interior-frame error of the current two-block baseline
# (linear temporal interpolation of the coarse endpoints, then block-replicate
# upsample), 67-90% is the temporal term U(x_c - I) -- linear interpolation
# cross-fades a moving vortex instead of translating it -- and only 10-32% is
# spatial blockiness. Translating the vortex anomaly to the interpolated
# storm centre (fme/downscaling/vortex_shift.py, found from the two coarse
# endpoint frames only) cut baseline MSE by ~26-35% on those windows.
#
# Data: local copy made by prepare_data.py (same dir). TRAIN 2013-01-02 .. 2021-12-31 (the
# same 9 years as the Beaker runs), VAL/TEST 2022-06-01 .. 2022-09-30 (4 months to keep
# validation cheap; the Beaker runs validated on all of 2022). Compare against the CONTROL
# config (same data/steps, flag off).
#
# Launch: VARIANT=vortex-bicubic bash run.sh   (GPUs 2,3,4,6,7)
#         VARIANT=control bash run.sh
# VARIANT: vortex (vortex_shift_baseline: true).
experiment_dir: /data/pmd/runs/video-pmd-two-block-vortex-shift-bicubic
# Measured on one L40S at 1 sample/GPU: ~1.8 s/step, ~38 GB peak. Global batch 5 = 5 GPUs x 1 sample/GPU
# (the original Beaker run used batch 4). ~13,100 steps per epoch over the 9-year train range = ~6.5 h/epoch
# on 5 GPUs; 20 epochs ~ 5 days (the original run was ~57 epochs = 937k steps; this is ~28% of that).
# Validation generates with the full 50-step sampler (~1 min per batch on one GPU), hence the small
# max_val/test_batches.
max_epochs: 60
validate_using_ema: true
validate_interval: 2
test_interval: 10
max_val_batches: 8
max_test_batches: 8
generate_n_samples: 1
log_loss_vs_noise: true
logging:
  log_to_screen: true
  log_to_wandb: false  # no W&B key on this machine; set true + export WANDB_API_KEY to enable
  log_to_file: true
  project: ace-temporal-interp
  name: local-25km-100km-two-block-vortex-shift-bicubic
  entity: ai2cm
optimization:
  lr: 0.0001
ema:
  decay: 0.9999
coarse_patch_extent_lat: 44
coarse_patch_extent_lon: 72
train_data:
  n_timesteps: 9
  fine:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  coarse:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2013-01-02"
        stop_time: "2021-12-31"
  batch_size: 5  # global across ranks (5 GPUs x 1 sample/GPU; 2/GPU needs ~75GB, OOMs a 46GB L40S)
  num_data_workers: 4
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
validation_data:
  n_timesteps: 9
  fine:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  coarse:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  batch_size: 5  # global across ranks (5 GPUs x 1 sample/GPU; 2/GPU needs ~75GB, OOMs a 46GB L40S)
  num_data_workers: 4
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
test_data:
  n_timesteps: 9
  fine:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-25km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  coarse:
    - data_path: /data/pmd/local_data
      file_pattern: 2026-07-14-X-SHiELD-AMIP-FME-3h-100km.zarr
      engine: zarr
      subset:
        start_time: "2022-06-01"
        stop_time: "2022-09-30"
  batch_size: 5  # global across ranks (5 GPUs x 1 sample/GPU; 2/GPU needs ~75GB, OOMs a 46GB L40S)
  num_data_workers: 4
  strict_ensemble: false
  lat_extent:
    start: -88
    stop: 88
  lon_extent:
    start: 0
    stop: 360
model:
  n_timesteps: 9
  model_channels: 128
  n_heads: 8
  num_freqs: 4
  backbone: simple
  noise_embedding_type: positional
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 2
  attention_levels: [3, 4]
  sigma_min: 0.002
  sigma_max: 150.0
  churn: 0.0
  num_diffusion_generation_steps: 50
  # Two-block mode: see the header comment above and
  # VideoDiffusionModelConfig.two_block's docstring in
  # fme/downscaling/video_models.py.
  endpoints_observed: false
  coarse_endpoints_only: true
  two_block: true
  # Bicubic (mean-preserving) spatial base instead of block replication: bicubic in space,
  # linear / vortex / V3 in time. Exact coarse recovery unchanged; d = x_f - S D x_f, so
  # d_sigma_data_by_channel below is the RMS of that smaller residual.
  two_block_spatial_upsample: bicubic
  r_kernel: brownian_bridge
  d_kernel: independent
  # Translation-aware baseline (vortex_shift.py). Adds n_channels conditioning
  # channels, so from-scratch only.
  vortex_shift_baseline: true
  vortex_slp_channel: PRMSL
  vortex_min_depth: 5.0      # hPa below the surrounding ring to count as a vortex
  vortex_taper_cells: 6.0    # coarse (100km) cells
  vortex_search_cells: 10.0  # max endpoint-to-endpoint centre distance, coarse cells
  # RMS of r = x_c - I(tau) over 2 x 1250 train / held-out patches (coarse-normalized units, interior steps),
  # scripts/v3_baseline/r_statistics.py. Linear and vortex baselines agree to <1%: storms are rare, so the vortex
  # baseline only changes r inside them.
  r_sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.34
    northward_wind_at_ten_meters: 0.4716
    PRMSL: 0.1652
    PRATEsfc: 0.8137
    air_temperature_at_two_meters: 0.1346
  # d = x_f - S D x_f with the bicubic base S: RMS of that target over 2 x 1250 train / held-out patches
  # (all 9 frames), scripts/v3_baseline/r_statistics.py. 0.78 / 0.80 / 0.58 / 0.86 / 0.80 of the block-base d
  # (u, v, PRMSL, precip, T2m). It does not depend on the temporal baseline, so it is shared by all configs.
  d_sigma_data_by_channel:
    eastward_wind_at_ten_meters: 0.1249
    northward_wind_at_ten_meters: 0.1503
    PRMSL: 0.0236
    PRATEsfc: 0.3904
    air_temperature_at_two_meters: 0.041
  log_transform_channels:
    PRATEsfc: 86400.0  # precip modeled in log1p(mm/day) space
  out_names:
    - eastward_wind_at_ten_meters
    - northward_wind_at_ten_meters
    - PRMSL
    - PRATEsfc
    - air_temperature_at_two_meters
  normalization:  # fine (25km), train-only, global domain -- toy/compute_norm_stats_25km.py
    means:
      eastward_wind_at_ten_meters: -0.036200
      northward_wind_at_ten_meters: 0.170470
      PRMSL: 1008.160699
      PRATEsfc: 0.484074   # log1p(PRATEsfc * 86400) space, matching log_transform_channels
      air_temperature_at_two_meters: 279.675977
    stds:
      eastward_wind_at_ten_meters: 5.627319
      northward_wind_at_ten_meters: 4.692752
      PRMSL: 15.043594
      PRATEsfc: 0.850964
      air_temperature_at_two_meters: 20.455977
  coarse_normalization:  # coarse (100km), train-only, global domain -- reused verbatim
    # from the stage-1 config: verified 2026-07-24 that the 100km store is
    # byte-identical to the dataset those stats were computed from.
    means:
      eastward_wind_at_ten_meters: -0.036135
      northward_wind_at_ten_meters: 0.186555
      PRMSL: 1008.281106
      PRATEsfc: 0.557112
      air_temperature_at_two_meters: 279.3386
    stds:
      eastward_wind_at_ten_meters: 5.548626
      northward_wind_at_ten_meters: 4.603089
      PRMSL: 14.908773
      PRATEsfc: 0.871331
      air_temperature_at_two_meters: 20.2363
